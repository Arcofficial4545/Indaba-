name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI has no Supabase project. The site builds on its fallback content, and
      # lib/env.ts is skipped so the build does not demand production secrets.
      SKIP_ENV_VALIDATION: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate route types
        run: npx next typegen

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
